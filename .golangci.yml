# This is our linters configuration
# We use https://github.com/golangci/golangci-lint because it allows us to run multiple linters at the same time

run:
  timeout: 5m
  skip-dirs:
    - stub

linters:
  enable-all: true
  disable:
    - maligned
    - wsl
    - whitespace
    - godox
    - godot
    - interfacer
    - nolintlint
    - noctx
    - gofumpt
    - exhaustive
    - gci
    - nlreturn
    - exhaustivestruct
    - forbidigo
    - paralleltest
    - cyclop # we already have gocyclo enabled
    - ifshort
    - nilerr
    - thelper
    - tagliatelle
    - golint # deprecated in favour of revive
    - scopelint # deprecated in favour of exportloopref
    - varnamelen
    - ireturn
    - exhaustruct
linters-settings:
  funlen:
    lines: 100
    statements: 40
  nakedret:
    max-func-lines: 0
  lll:
    line-length: 140
  gocyclo:
    min-complexity: 20
  golint:
    min-confidence: 0
  dupl:
    threshold: 100
  govet:
    check-shadowing: true
    settings:
      printf:
        funcs:
          - (bitbucket.gcore.lu/core/mapi/src/common/logger.Log).Debugf
          - (bitbucket.gcore.lu/core/mapi/src/common/logger.Log).Infof
          - (bitbucket.gcore.lu/core/mapi/src/common/logger.Log).Warnf
          - (bitbucket.gcore.lu/core/mapi/src/common/logger.Log).Errorf
          - (bitbucket.gcore.lu/core/mapi/src/common/logger.Log).Critf
  wrapcheck:
    # An array of strings that specify substrings of signatures to ignore.
    # If this set, it will override the default set of ignored signatures.
    # See https://github.com/tomarrell/wrapcheck#configuration for more information.
    ignoreSigs:
      - .Errorf(
      - errors.New(
      - errors.Unwrap(
      - .Wrap(
      - .Wrapf(
      - .WithMessage(
      - .WithMessagef(
      - .WithStack(
output:
  print-issued-lines: false

issues:
  exclude-use-default: false
  max-per-linter: 0
  max-same-issues: 0
  new-from-rev: HEAD~
  exclude:
  - "should have a package comment, unless it's in another file for this package"
  - "(struct field|var|func|method|func parameter|range var|const|type) .* should be .*"
  - "the channel used with signal.Notify should be buffered"
  - "G104:" # go-sec rule of err checking, it has the same logic as errcheck linter, so ignore duplicate
  - "Error return value of `.*.Body.Close` is not checked"
  - "Error return value of `.*.Close()` is not checked"
  - "Error return value of `rows.Close` is not checked"
  - "Error return value of `viper.BindEnv` is not checked"
  - "G108: Profiling endpoint is automatically exposed on /debug/pprof"
  - "exported var Err.* should have comment or be unexported"
  - "put a space between `//` and comment text"
  - "Function 'main' has too many statements"
  - "ST1000:"
  - "G204:" # G204: Subprocess launched with variable (gosec) - useless, we often launch different cmds with params
  exclude-rules:
    - path: _test\.go
      linters:
        - gochecknoglobals
        - goconst
        - errcheck
        - gosec
        - gomnd
        - funlen
        - testpackage
        - lll
        - bodyclose
        - unparam
        - dupl
        - goerr113
        - wrapcheck
    - linters:
        - lll
      source: "^//go:generate "

